<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316a34a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polyline points='12 6 12 12 16 14'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeGauge — Personal Analytics Cockpit</title>
    <!-- Zero-FOUC Theme Script: runs synchronously before paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lifegauge_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var shouldBeDark =
            stored === 'dark' ||
            (stored === 'system' || stored === null) && prefersDark;
          if (shouldBeDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
